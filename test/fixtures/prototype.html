<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>验收测试原型 — 订单确认页</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    max-width: 860px;
    margin: 36px auto 80px;
    padding: 0 28px;
    color: #1f2937;
    line-height: 1.7;
    position: relative;
    background: #f8fafc;
  }
  .page-head {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 24px 26px;
    margin-bottom: 18px;
  }
  h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: -.4px; }
  h2 { font-size: 18px; margin: 28px 0 10px; color: #1d4ed8; }
  p { margin: 10px 0; }
  .muted { color: #6b7280; font-size: 13px; }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    background: #eff6ff; color: #2563eb; font-size: 12px;
  }
  .actions { display: flex; gap: 10px; align-items: center; margin: 18px 0; }
  button { font: inherit; cursor: pointer; }
  .btn-primary {
    padding: 10px 22px; border: 0; border-radius: 9px;
    background: #2563eb; color: #fff; font-weight: 600;
  }
  .btn-ghost {
    padding: 9px 18px; border: 1px solid #d1d5db; border-radius: 9px;
    background: #fff; color: #374151;
  }
  select {
    padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 9px;
    background: #fff; color: #1f2937;
  }
  .floating-note {
    position: absolute; top: 46px; right: -18px; width: 180px;
    padding: 12px; border-radius: 10px;
    background: #fffbeb; border: 1px solid #f59e0b;
    color: #92400e; font-size: 12px; line-height: 1.6;
    box-shadow: 0 5px 18px rgba(15, 23, 42, .08);
  }
  .card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
    padding: 18px 20px; margin: 14px 0;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #e5e7eb; padding: 10px 12px; text-align: left; }
  th { background: #f8fafc; font-weight: 600; }
  ul { padding-left: 22px; }
  li { margin: 5px 0; }
  .footer { margin-top: 36px; color: #9ca3af; font-size: 12px; text-align: center; }
</style>
</head>
<body>
  <div class="page-head">
    <h1>订单确认页</h1>
    <p class="muted">用于验收：选中、拖拽、文本、下拉框、表格、批注、导出。</p>
    <p>请确认以下订单信息。点击「提交订单」后进入支付流程。</p>
  </div>

  <div class="floating-note">这是一个绝对定位的提示条。<br>可以拖拽移动。</div>

  <h2>1. 订单信息</h2>
  <div class="card">
    <table id="order-table">
      <thead>
        <tr><th>商品</th><th>数量</th><th>小计</th></tr>
      </thead>
      <tbody>
        <tr><td>专业版 · 年付</td><td>1</td><td>¥ 1,299</td></tr>
        <tr><td>团队席位</td><td>3</td><td>¥ 900</td></tr>
        <tr><td>优惠券</td><td>1</td><td>- ¥ 200</td></tr>
      </tbody>
    </table>
    <p class="muted">合计：<strong>¥ 1,999</strong>（含税）</p>
  </div>

  <h2>2. 支付方式</h2>
  <div class="actions">
    <button class="btn-primary" type="button">提交订单</button>
    <button class="btn-ghost" type="button">保存草稿</button>
    <select id="pay-method">
      <option value="card">银行卡</option>
      <option value="alipay" selected>支付宝</option>
      <option value="wechat">微信支付</option>
    </select>
  </div>

  <h2>3. 边界情况</h2>
  <ul>
    <li>库存不足时，提交按钮置灰并提示具体商品。</li>
    <li>优惠券失效时，重新计算总价并提示用户。</li>
    <li>支付超时后，订单保持待支付状态 30 分钟。</li>
  </ul>

  <p class="footer">HTML Workbench 验收素材 · 单文件 · 无外部依赖</p>

  <script>
    // 编辑器默认在 sandbox 中不执行这段脚本；导出干净版后可独立运行。
    window.__fixtureScriptRan = true;
    document.documentElement.setAttribute('data-fixture-script', 'ran');
  </script>
</body>
</html>
